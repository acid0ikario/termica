[package]
name = "termicad"
version.workspace = true
edition.workspace = true

[dependencies]
env_logger = "0.11.11"
futures-util = "0.3.34"
log = "0.4.35"
nvml-wrapper = "0.13.0"
serde_json = "1.0.154"
termica-core = { path = "../termica-core" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
zbus = { version = "6.2.0", default-features = false, features = ["tokio", "proxy", "service"] }
